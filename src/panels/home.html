<div class="container">
    <div class="home-header">
        <div class="status-server">
            <img class="server-status-icon" src="assets/images/icon.png">
            <div class="server-status-infos">
                <div class="server-status-name">Minecraft</div>
                <div class="server-status-text">Connexion...</div>
            </div>
            <div class="status-player-count">
                <div class="player-count">0</div>
                <div class="player-count-label">joueurs</div>
            </div>
        </div>

        <div class="social-tab">
            <div class="social-list">
                <div data-url="https://github.com/docovg" class="social-block" title="GitHub">
                    <div class="icon-github icon-social"></div>
                </div>
                <div data-url="https://abdelnaim.fr" class="social-block" title="Site web">
                    <div class="icon-web icon-social"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="home-bottom">
        <div class="new-tab">
            <div class="news-tab-header">
                <div class="titre-tab-new">DevLog</div>
                <div class="news-tab-subtitle">Les dernières nouveautés</div>
            </div>
            <div class="news-list content-scroll"></div>
        </div>
        <div class="player-showcase">
            <div class="player-body"></div>
        </div>
    </div>

    <div class="sidebar">
        <div class="player-options" title="Gérer les comptes">
            <div class="player-head"></div>
            <div class="player-infos">
                <div class="player-name">Joueur</div>
                <div class="player-subtitle">Changer de compte</div>
            </div>
        </div>
        <div class="play-elements">
            <div class="play-instance">
                <button class="play-btn">
                    <span class="play-btn-text">Jouer</span>
                    <span class="play-instance-name"></span>
                </button>
                <div class="instance-select icon-arrow" title="Choisir une instance"></div>
            </div>
            <div class="info-starting-game">
                <div class="info-starting-game-text">Connexion...</div>
                <progress value="0" max="0" class="progress-bar"></progress>
            </div>
        </div>

        <div class="sidebar-right">
            <div class="settings-btn icon-settings" title="Paramètres"></div>
        </div>
    </div>

    <div class="instance-popup">
        <div class="instances-tab">
            <div class="close-popup icon-close"></div>
            <p>Choisissez votre instance</p>
            <div class="instances-List"></div>
        </div>
    </div>
</div>
